# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

# supersede running builds of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual run'

jobs:
  build_chdb:
    name: Build chdb-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
       include:
         # macos runners are arm64 since macos-14, so there is no runner to
         # actually test osx-x64 anymore - it is only packed, not tested
         - os: ubuntu-latest
           rid: linux-x64
         - os: macos-latest
           rid: osx-arm64

    steps:
    - name: 'Print manual run reason'
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        echo 'Reason: ${{ github.event.inputs.reason }}'

    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Display dotnet version
      run: |
        dotnet --version
        echo "GITHUB_WORKSPACE $GITHUB_WORKSPACE"
        echo "GITHUB_ACTION $GITHUB_ACTION"
        echo "GITHUB_RUN_ID $GITHUB_RUN_ID"
        echo "GITHUB_RUN_NUMBER $GITHUB_RUN_NUMBER"

    - name: Restore
      run: dotnet restore

    - name: Download chdb library
      run: ./update_libchdb.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build
      run: |
        ls -lahS lib/*/libchdb.so
        dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test -c Release /p:TestTfmsInParallel=false --logger "console;verbosity=detailed" --no-build --logger trx --results-directory "TestResults-${{ matrix.rid }}"

    # - name: Upload dotnet test results
